spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/html_deploy}
    username: ${DB_USERNAME:html_deploy}
    password: ${DB_PASSWORD:html_deploy}
    driver-class-name: org.postgresql.Driver

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  content-scheme: ${CONTENT_SCHEME:http}
  content-domain: ${CONTENT_DOMAIN:apps.localhost:8081}
  storage-root: ${STORAGE_ROOT:/srv/html-deploy}
  nginx-root: ${NGINX_ROOT:/srv/html-deploy/www}
  upload-token-secret: ${UPLOAD_TOKEN_SECRET:replace-this-production-upload-secret}
  storage:
    type: s3
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:html-deploy}
    region: ${S3_REGION:us-east-1}
  security:
    jwt-secret: ${JWT_SECRET:replace-this-production-jwt-secret-with-32-bytes}
  release:
    provider: ${RELEASE_PROVIDER:local}
    poll-interval: ${RELEASE_POLL_INTERVAL:2s}
    publish-timeout: ${RELEASE_PUBLISH_TIMEOUT:5m}
  netlify:
    api-base-url: ${NETLIFY_API_BASE_URL:https://api.netlify.com/api/v1}
    auth-token: ${NETLIFY_AUTH_TOKEN:}
    site-prefix: ${NETLIFY_SITE_PREFIX:}
