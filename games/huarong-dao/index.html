<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f3ec">
    <title>数字华容道</title>
    <style>
        :root {
            --paper: #f5f3ec;
            --ink: #20231f;
            --muted: #6f746c;
            --line: #d8d9d1;
            --tile: #2f766f;
            --tile-dark: #1f5c57;
            --accent: #d78b2d;
            --danger: #a83e32;
            --panel: #fffef9;
            --n: 4;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: "Noto Sans SC", "Microsoft YaHei", ui-sans-serif, sans-serif;
            background:
                linear-gradient(90deg, rgba(47, 118, 111, 0.055) 1px, transparent 1px),
                linear-gradient(rgba(47, 118, 111, 0.055) 1px, transparent 1px),
                var(--paper);
            background-size: 24px 24px;
        }

        button {
            font: inherit;
        }

        .page {
            width: min(720px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: max(18px, env(safe-area-inset-top)) 18px max(26px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 17px;
        }

        .header {
            width: min(430px, 100%);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(29px, 8vw, 43px);
            letter-spacing: 0.08em;
            line-height: 1;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .level-badge {
            min-width: 52px;
            height: 42px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--tile-dark);
            font-size: 14px;
            font-weight: 800;
        }

        .board-shell {
            position: relative;
            width: min(430px, 100%);
            padding: 13px;
            border: 1px solid #c9ccc4;
            border-radius: 12px;
            background: #e7e5dc;
            box-shadow:
                0 22px 44px rgba(45, 52, 47, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .board {
            width: 100%;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(var(--n), minmax(0, 1fr));
            grid-template-rows: repeat(var(--n), minmax(0, 1fr));
            gap: clamp(5px, 1.8vw, 9px);
            touch-action: none;
        }

        .tile {
            min-width: 0;
            min-height: 0;
            display: grid;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(145deg, #3d8b83, var(--tile-dark));
            color: #ffffff;
            font-size: clamp(19px, calc(62px / var(--n)), 40px);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.24),
                inset 0 -5px 0 rgba(0, 0, 0, 0.14),
                0 4px 8px rgba(45, 52, 47, 0.16);
            transition:
                filter 120ms ease,
                transform 120ms ease,
                background 120ms ease;
        }

        .tile:hover {
            filter: brightness(1.06);
        }

        .tile:active {
            transform: scale(0.97);
        }

        .tile--accent {
            background: linear-gradient(145deg, #e2a44e, #b66c1c);
        }

        .tile--empty {
            visibility: hidden;
            pointer-events: none;
        }

        .tile.is-correct {
            box-shadow:
                inset 0 0 0 2px rgba(255, 244, 190, 0.72),
                inset 0 -5px 0 rgba(0, 0, 0, 0.14),
                0 4px 8px rgba(45, 52, 47, 0.14);
        }

        .stats {
            width: min(430px, 100%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: rgba(255, 254, 249, 0.5);
        }

        .stat {
            padding: 10px 8px;
            text-align: center;
        }

        .stat + .stat {
            border-left: 1px solid var(--line);
        }

        .stat span {
            display: block;
            color: var(--muted);
            font-size: 11px;
        }

        .stat strong {
            display: block;
            margin-top: 3px;
            font-size: 19px;
            font-variant-numeric: tabular-nums;
        }

        .difficulty {
            width: min(430px, 100%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .difficulty button,
        .control {
            min-height: 40px;
            border: 1px solid #c8ccc3;
            border-radius: 7px;
            background: var(--panel);
            color: #35413b;
            font-weight: 700;
        }

        .difficulty button.is-active {
            border-color: var(--tile);
            background: #dcece9;
            color: var(--tile-dark);
        }

        .controls {
            width: min(430px, 100%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .control--primary {
            border-color: var(--tile-dark);
            background: var(--tile);
            color: #ffffff;
        }

        .overlay {
            position: absolute;
            z-index: 20;
            inset: 13px;
            display: grid;
            place-items: center;
            padding: 22px;
            border-radius: 8px;
            background: rgba(25, 31, 28, 0.84);
            color: #fffdf7;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .overlay.is-visible {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            margin: 0;
            font-size: clamp(28px, 8vw, 42px);
            letter-spacing: 0.06em;
        }

        .overlay p {
            margin: 10px 0 22px;
            color: rgba(255, 253, 247, 0.82);
        }

        .overlay button {
            min-width: 142px;
            min-height: 42px;
            border: 1px solid #fff3c4;
            border-radius: 7px;
            background: transparent;
            color: #fffdf7;
            font-weight: 700;
        }

        @media (max-width: 420px) {
            .page {
                padding-inline: 11px;
                gap: 14px;
            }

            .board-shell {
                padding: 10px;
            }

            .overlay {
                inset: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tile,
            .overlay {
                transition: none;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="header">
        <div>
            <h1>数字华容道</h1>
            <p class="subtitle">按顺序排列数字，把空格留在右下角</p>
        </div>
        <div id="levelBadge" class="level-badge">4×4</div>
    </header>

    <section class="board-shell" aria-label="数字华容道棋盘">
        <div id="board" class="board" role="grid" aria-label="数字滑块棋盘"></div>
        <div id="overlay" class="overlay" aria-live="polite">
            <div>
                <h2>全部归位</h2>
                <p id="winSummary"></p>
                <button type="button" id="playAgain">再来一局</button>
            </div>
        </div>
    </section>

    <section class="stats" aria-label="游戏数据">
        <div class="stat">
            <span>步数</span>
            <strong id="moveCount">0</strong>
        </div>
        <div class="stat">
            <span>用时</span>
            <strong id="timer">00:00</strong>
        </div>
        <div class="stat">
            <span>已完成</span>
            <strong id="progress">0%</strong>
        </div>
    </section>

    <section class="difficulty" aria-label="难度">
        <button type="button" data-size="3">3×3</button>
        <button type="button" data-size="4" class="is-active">4×4</button>
        <button type="button" data-size="5">5×5</button>
    </section>

    <section class="controls" aria-label="操作">
        <button class="control" type="button" id="undo">撤销</button>
        <button class="control control--primary" type="button" id="reset">重开</button>
    </section>
</main>

<script>
    const board = document.getElementById("board");
    const overlay = document.getElementById("overlay");
    const moveCount = document.getElementById("moveCount");
    const timer = document.getElementById("timer");
    const progress = document.getElementById("progress");
    const levelBadge = document.getElementById("levelBadge");
    const winSummary = document.getElementById("winSummary");

    let size = 4;
    let state = [];
    let blankIndex = 0;
    let moves = 0;
    let seconds = 0;
    let timerId = null;
    let started = false;
    let finished = false;
    let history = [];
    let drag = null;

    function solvedState(n) {
        const values = Array.from({ length: n * n - 1 }, (_, index) => index + 1);
        values.push(0);
        return values;
    }

    function shuffleState(n) {
        const shuffled = solvedState(n);
        let blank = shuffled.length - 1;
        let previousBlank = -1;
        const attempts = n * n * 35;

        for (let index = 0; index < attempts; index += 1) {
            const neighbors = validNeighbors(blank, n).filter((candidate) => candidate !== previousBlank);
            const next = neighbors[Math.floor(Math.random() * neighbors.length)];
            previousBlank = blank;
            shuffled[blank] = shuffled[next];
            shuffled[next] = 0;
            blank = next;
        }
        return { values: shuffled, blank };
    }

    function validNeighbors(index, n) {
        const row = Math.floor(index / n);
        const column = index % n;
        const neighbors = [];
        if (row > 0) neighbors.push(index - n);
        if (row < n - 1) neighbors.push(index + n);
        if (column > 0) neighbors.push(index - 1);
        if (column < n - 1) neighbors.push(index + 1);
        return neighbors;
    }

    function initialize(n = size) {
        size = n;
        const shuffled = shuffleState(n);
        state = shuffled.values;
        blankIndex = shuffled.blank;
        moves = 0;
        seconds = 0;
        started = false;
        finished = false;
        history = [];
        drag = null;
        window.clearInterval(timerId);
        timerId = null;
        timer.textContent = "00:00";
        levelBadge.textContent = `${n}×${n}`;
        overlay.classList.remove("is-visible");
        document.documentElement.style.setProperty("--n", n);
        document.querySelectorAll(".difficulty button").forEach((button) => {
            button.classList.toggle("is-active", Number(button.dataset.size) === n);
        });
        render();
    }

    function render() {
        board.replaceChildren();
        const totalTiles = size * size - 1;
        let correct = 0;

        state.forEach((value, index) => {
            if (value === 0) {
                const blank = document.createElement("div");
                blank.className = "tile tile--empty";
                blank.setAttribute("aria-hidden", "true");
                board.appendChild(blank);
                return;
            }

            const button = document.createElement("button");
            button.type = "button";
            button.className = "tile";
            if (value === index + 1) {
                button.classList.add("is-correct");
                correct += 1;
            }
            if ((value + size) % 2 === 0) {
                button.classList.add("tile--accent");
            }
            button.dataset.index = index;
            button.textContent = value;
            button.setAttribute("aria-label", `数字 ${value}`);
            button.addEventListener("click", () => moveTile(index));
            button.addEventListener("pointerdown", onPointerDown);
            board.appendChild(button);
        });

        moveCount.textContent = String(moves);
        progress.textContent = `${Math.round((correct / totalTiles) * 100)}%`;
    }

    function moveTile(index) {
        if (finished || !validNeighbors(blankIndex, size).includes(index)) {
            return false;
        }

        history.push({ tileIndex: index, blankIndex });
        state[blankIndex] = state[index];
        state[index] = 0;
        blankIndex = index;
        moves += 1;
        startTimer();
        render();
        checkWin();
        return true;
    }

    function onPointerDown(event) {
        if (finished) {
            return;
        }
        drag = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            index: Number(event.currentTarget.dataset.index)
        };
        event.currentTarget.addEventListener("pointerup", onPointerUp, { once: true });
        event.currentTarget.addEventListener("pointercancel", () => {
            drag = null;
        }, { once: true });
    }

    function onPointerUp(event) {
        if (!drag || drag.pointerId !== event.pointerId) {
            drag = null;
            return;
        }
        const dx = event.clientX - drag.startX;
        const dy = event.clientY - drag.startY;
        const threshold = Math.max(15, board.getBoundingClientRect().width / (size * 7));
        const index = drag.index;
        drag = null;

        if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) {
            return;
        }

        let target = index;
        if (Math.abs(dx) >= Math.abs(dy)) {
            if ((index % size === 0 && dx < 0) || (index % size === size - 1 && dx > 0)) {
                return;
            }
            target += dx > 0 ? 1 : -1;
        } else {
            target += dy > 0 ? size : -size;
        }

        if (target === blankIndex) {
            moveTile(index);
        }
    }

    function startTimer() {
        if (started || finished) {
            return;
        }
        started = true;
        timerId = window.setInterval(() => {
            seconds += 1;
            timer.textContent = formatTime(seconds);
        }, 1000);
    }

    function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const remainder = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
    }

    function checkWin() {
        const goal = solvedState(size);
        if (!state.every((value, index) => value === goal[index])) {
            return;
        }
        finished = true;
        window.clearInterval(timerId);
        timerId = null;
        winSummary.textContent = `${size}×${size} · ${moves} 步 · ${formatTime(seconds)}`;
        overlay.classList.add("is-visible");
    }

    function undo() {
        if (finished || history.length === 0) {
            return;
        }
        const previous = history.pop();
        state[previous.blankIndex] = state[previous.tileIndex];
        state[previous.tileIndex] = 0;
        blankIndex = previous.tileIndex;
        moves = Math.max(0, moves - 1);
        render();
    }

    document.addEventListener("keydown", (event) => {
        if (finished) {
            return;
        }
        const blankRow = Math.floor(blankIndex / size);
        const blankColumn = blankIndex % size;
        let tileIndex = null;

        if (event.key === "ArrowLeft" && blankColumn < size - 1) tileIndex = blankIndex + 1;
        if (event.key === "ArrowRight" && blankColumn > 0) tileIndex = blankIndex - 1;
        if (event.key === "ArrowUp" && blankRow < size - 1) tileIndex = blankIndex + size;
        if (event.key === "ArrowDown" && blankRow > 0) tileIndex = blankIndex - size;
        if (tileIndex == null) return;

        event.preventDefault();
        moveTile(tileIndex);
    });

    document.querySelectorAll(".difficulty button").forEach((button) => {
        button.addEventListener("click", () => initialize(Number(button.dataset.size)));
    });
    document.getElementById("undo").addEventListener("click", undo);
    document.getElementById("reset").addEventListener("click", () => initialize(size));
    document.getElementById("playAgain").addEventListener("click", () => initialize(size));

    initialize(4);
</script>
</body>
</html>
