<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3efe4">
    <title>华容道</title>
    <style>
        :root {
            --paper: #f3efe4;
            --ink: #24231f;
            --muted: #726c61;
            --wood: #5a3c28;
            --wood-dark: #3d281b;
            --board: #d9b981;
            --board-deep: #b98b54;
            --red: #b5382d;
            --red-dark: #7d251e;
            --teal: #367a75;
            --teal-dark: #23544f;
            --gold: #b58a42;
            --cell: clamp(58px, 17.5vw, 78px);
            --gap: clamp(5px, 1.2vw, 8px);
            --unit: calc(var(--cell) + var(--gap));
            --board-width: calc(var(--cell) * 4 + var(--gap) * 3);
            --board-height: calc(var(--cell) * 5 + var(--gap) * 4);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: "Noto Serif SC", "Songti SC", "STSong", "Microsoft YaHei", serif;
            background:
                radial-gradient(circle at 18% 12%, rgba(181, 138, 66, 0.12), transparent 24rem),
                linear-gradient(120deg, rgba(90, 60, 40, 0.04) 1px, transparent 1px),
                var(--paper);
            background-size: auto, 18px 18px, auto;
        }

        button {
            font: inherit;
        }

        .page {
            width: min(760px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .game-header {
            width: min(430px, 100%);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
        }

        .title-group h1 {
            margin: 0;
            font-size: clamp(29px, 8vw, 44px);
            letter-spacing: 0.16em;
            line-height: 1;
        }

        .title-group p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.08em;
        }

        .seal {
            width: 48px;
            height: 48px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border: 2px solid var(--red);
            color: var(--red);
            font-size: 16px;
            font-weight: 800;
            line-height: 1;
            transform: rotate(4deg);
            box-shadow: inset 0 0 0 3px rgba(181, 56, 45, 0.08);
        }

        .board-shell {
            position: relative;
            width: min(430px, 100%);
            padding: 14px;
            border: 1px solid rgba(61, 40, 27, 0.42);
            background: linear-gradient(145deg, #7b5538, #4a3020);
            box-shadow:
                0 24px 50px rgba(61, 40, 27, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .board-shell::before,
        .board-shell::after {
            content: "";
            position: absolute;
            inset: 7px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .board-shell::after {
            inset: 10px;
            border-color: rgba(0, 0, 0, 0.2);
        }

        .board {
            position: relative;
            width: var(--board-width);
            height: var(--board-height);
            margin: 0 auto;
            overflow: hidden;
            background-color: var(--board);
            background-image:
                linear-gradient(rgba(90, 60, 40, 0.18) 1px, transparent 1px),
                linear-gradient(90deg, rgba(90, 60, 40, 0.18) 1px, transparent 1px);
            background-size: var(--unit) var(--unit);
            border: 1px solid var(--wood-dark);
            box-shadow: inset 0 0 24px rgba(61, 40, 27, 0.2);
            touch-action: none;
        }

        .exit-marker {
            position: absolute;
            z-index: 1;
            left: var(--unit);
            top: calc(var(--unit) * 5 + 2px);
            width: calc(var(--cell) * 2 + var(--gap));
            height: 9px;
            border-radius: 999px;
            background: var(--red);
            box-shadow: 0 0 0 3px rgba(181, 56, 45, 0.16);
        }

        .piece {
            position: absolute;
            z-index: 2;
            left: calc(var(--unit) * var(--x));
            top: calc(var(--unit) * var(--y));
            width: calc(var(--cell) * var(--w) + var(--gap) * (var(--w) - 1));
            height: calc(var(--cell) * var(--h) + var(--gap) * (var(--h) - 1));
            padding: 0;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 7px;
            color: #fff9ec;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.32),
                inset 0 -5px 0 rgba(0, 0, 0, 0.16),
                0 4px 8px rgba(61, 40, 27, 0.24);
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition:
                left 160ms cubic-bezier(0.2, 0.75, 0.2, 1),
                top 160ms cubic-bezier(0.2, 0.75, 0.2, 1),
                filter 160ms ease,
                transform 160ms ease;
        }

        .piece:active {
            cursor: grabbing;
        }

        .piece::after {
            content: "";
            position: absolute;
            inset: 5px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 4px;
            pointer-events: none;
        }

        .piece--boss {
            background: linear-gradient(145deg, #c84a3c, var(--red-dark));
            font-size: clamp(21px, 6vw, 30px);
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .piece--general {
            background: linear-gradient(145deg, #438b84, var(--teal-dark));
            font-size: clamp(16px, 4.6vw, 23px);
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .piece--vertical {
            writing-mode: vertical-rl;
            letter-spacing: 0.14em;
        }

        .piece--soldier {
            background: linear-gradient(145deg, #c7a054, #8a6329);
            font-size: clamp(16px, 4.5vw, 22px);
            font-weight: 800;
        }

        .piece.is-selected {
            z-index: 4;
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow:
                inset 0 0 0 2px #fff3c4,
                inset 0 -5px 0 rgba(0, 0, 0, 0.14),
                0 8px 14px rgba(61, 40, 27, 0.34);
        }

        .piece:focus-visible {
            outline: 3px solid #fff3c4;
            outline-offset: 3px;
        }

        .stats {
            width: min(430px, 100%);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid rgba(61, 40, 27, 0.2);
            border-bottom: 1px solid rgba(61, 40, 27, 0.2);
        }

        .stat {
            padding: 11px 8px;
            text-align: center;
        }

        .stat + .stat {
            border-left: 1px solid rgba(61, 40, 27, 0.18);
        }

        .stat span {
            display: block;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.12em;
        }

        .stat strong {
            display: block;
            margin-top: 3px;
            font-size: 19px;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            width: min(430px, 100%);
            display: flex;
            gap: 10px;
        }

        .control {
            min-height: 44px;
            flex: 1;
            border: 1px solid rgba(61, 40, 27, 0.38);
            background: #fffaf0;
            color: var(--ink);
            font-weight: 700;
            letter-spacing: 0.08em;
            box-shadow: 0 3px 0 rgba(61, 40, 27, 0.18);
        }

        .control:hover {
            background: #fffdf7;
        }

        .control:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 rgba(61, 40, 27, 0.18);
        }

        .control--primary {
            border-color: var(--red-dark);
            background: var(--red);
            color: #fff9ec;
        }

        .control--primary:hover {
            background: #a63128;
        }

        .overlay {
            position: absolute;
            z-index: 10;
            inset: 14px;
            display: grid;
            place-items: center;
            padding: 22px;
            background: rgba(32, 28, 23, 0.82);
            color: #fff9ec;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease;
        }

        .overlay.is-visible {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            margin: 0;
            font-size: clamp(28px, 8vw, 42px);
            letter-spacing: 0.12em;
        }

        .overlay p {
            margin: 10px 0 22px;
            color: rgba(255, 249, 236, 0.82);
        }

        .overlay button {
            min-width: 140px;
            min-height: 42px;
            border: 1px solid #fff3c4;
            background: transparent;
            color: #fff9ec;
            font-weight: 700;
        }

        @media (max-width: 420px) {
            :root {
                --cell: clamp(54px, 19.5vw, 72px);
                --gap: 5px;
            }

            .page {
                padding-inline: 10px;
                gap: 14px;
            }

            .board-shell {
                padding: 11px;
            }

            .overlay {
                inset: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .piece,
            .overlay {
                transition: none;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="game-header">
        <div class="title-group">
            <h1>华容道</h1>
            <p>目标：让曹操移到底部出口</p>
        </div>
        <div class="seal" aria-label="经典局">经典</div>
    </header>

    <section class="board-shell" aria-label="华容道棋盘">
        <div id="board" class="board" role="grid" aria-label="四列五行的华容道棋盘">
            <div class="exit-marker" aria-hidden="true"></div>
        </div>
        <div id="overlay" class="overlay" aria-live="polite">
            <div>
                <h2>曹操脱险</h2>
                <p id="winSummary"></p>
                <button type="button" id="playAgain">再来一局</button>
            </div>
        </div>
    </section>

    <section class="stats" aria-label="游戏数据">
        <div class="stat">
            <span>步数</span>
            <strong id="moveCount">0</strong>
        </div>
        <div class="stat">
            <span>用时</span>
            <strong id="timer">00:00</strong>
        </div>
        <div class="stat">
            <span>空格</span>
            <strong>2</strong>
        </div>
    </section>

    <section class="controls" aria-label="操作">
        <button class="control" type="button" id="undo">撤销</button>
        <button class="control control--primary" type="button" id="reset">重开</button>
    </section>
</main>

<script>
    const COLS = 4;
    const ROWS = 5;

    const layouts = [
        { id: "cao", name: "曹操", x: 1, y: 0, w: 2, h: 2, type: "boss" },
        { id: "zhang", name: "张飞", x: 0, y: 0, w: 1, h: 2, type: "general" },
        { id: "zhao", name: "赵云", x: 3, y: 0, w: 1, h: 2, type: "general" },
        { id: "ma", name: "马超", x: 0, y: 2, w: 1, h: 2, type: "general" },
        { id: "huang", name: "黄忠", x: 3, y: 2, w: 1, h: 2, type: "general" },
        { id: "guan", name: "关羽", x: 1, y: 2, w: 2, h: 1, type: "general horizontal" },
        { id: "zu1", name: "卒", x: 1, y: 3, w: 1, h: 1, type: "soldier" },
        { id: "zu2", name: "卒", x: 2, y: 3, w: 1, h: 1, type: "soldier" },
        { id: "zu3", name: "卒", x: 0, y: 4, w: 1, h: 1, type: "soldier" },
        { id: "zu4", name: "卒", x: 3, y: 4, w: 1, h: 1, type: "soldier" }
    ];

    const board = document.getElementById("board");
    const overlay = document.getElementById("overlay");
    const moveCount = document.getElementById("moveCount");
    const timer = document.getElementById("timer");
    const winSummary = document.getElementById("winSummary");

    let pieces = cloneLayout();
    let selectedId = null;
    let moves = 0;
    let seconds = 0;
    let timerId = null;
    let started = false;
    let finished = false;
    let history = [];
    let drag = null;

    function cloneLayout() {
        return layouts.map((piece) => ({ ...piece }));
    }

    function render() {
        board.querySelectorAll(".piece").forEach((element) => element.remove());

        pieces.forEach((piece) => {
            const element = document.createElement("button");
            element.type = "button";
            element.className = `piece piece--${piece.type.replace(" horizontal", "")}`;
            if (piece.type.includes("horizontal") || piece.w === 1) {
                element.classList.remove("piece--vertical");
            }
            if (piece.h > piece.w) {
                element.classList.add("piece--vertical");
            }
            if (piece.id === selectedId) {
                element.classList.add("is-selected");
            }
            element.dataset.pieceId = piece.id;
            element.setAttribute("aria-label", `${piece.name}，位于第 ${piece.y + 1} 行第 ${piece.x + 1} 列`);
            element.style.setProperty("--x", piece.x);
            element.style.setProperty("--y", piece.y);
            element.style.setProperty("--w", piece.w);
            element.style.setProperty("--h", piece.h);
            element.textContent = piece.name;
            element.addEventListener("pointerdown", onPiecePointerDown);
            element.addEventListener("click", onPieceClick);
            board.appendChild(element);
        });

        moveCount.textContent = String(moves);
    }

    function onPiecePointerDown(event) {
        if (finished) {
            return;
        }

        const element = event.currentTarget;
        const piece = findPiece(element.dataset.pieceId);
        selectPiece(piece.id);
        drag = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            pieceId: piece.id,
            moved: false
        };
        element.setPointerCapture?.(event.pointerId);
        element.addEventListener("pointerup", onPiecePointerUp, { once: true });
        element.addEventListener("pointercancel", onPiecePointerCancel, { once: true });
    }

    function onPiecePointerUp(event) {
        if (!drag || drag.pointerId !== event.pointerId) {
            drag = null;
            return;
        }

        const dx = event.clientX - drag.startX;
        const dy = event.clientY - drag.startY;
        const threshold = Math.max(18, board.getBoundingClientRect().width / 14);
        const piece = findPiece(drag.pieceId);
        drag = null;

        if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) {
            return;
        }

        if (Math.abs(dx) >= Math.abs(dy)) {
            movePiece(piece, dx > 0 ? 1 : -1, 0);
        } else {
            movePiece(piece, 0, dy > 0 ? 1 : -1);
        }
    }

    function onPiecePointerCancel() {
        drag = null;
    }

    function onPieceClick(event) {
        if (drag) {
            return;
        }
        selectPiece(event.currentTarget.dataset.pieceId);
    }

    function selectPiece(id) {
        selectedId = id;
        board.querySelectorAll(".piece").forEach((element) => {
            element.classList.toggle("is-selected", element.dataset.pieceId === id);
        });
    }

    function findPiece(id) {
        return pieces.find((piece) => piece.id === id);
    }

    function buildOccupancy(excludedId = null) {
        const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        pieces.forEach((piece) => {
            if (piece.id === excludedId) {
                return;
            }
            for (let y = piece.y; y < piece.y + piece.h; y += 1) {
                for (let x = piece.x; x < piece.x + piece.w; x += 1) {
                    grid[y][x] = piece.id;
                }
            }
        });
        return grid;
    }

    function movePiece(piece, dx, dy) {
        if (finished || !piece) {
            return false;
        }

        const nextX = piece.x + dx;
        const nextY = piece.y + dy;
        if (nextX < 0 || nextY < 0 || nextX + piece.w > COLS || nextY + piece.h > ROWS) {
            return false;
        }

        const occupancy = buildOccupancy(piece.id);
        for (let y = nextY; y < nextY + piece.h; y += 1) {
            for (let x = nextX; x < nextX + piece.w; x += 1) {
                if (occupancy[y][x]) {
                    return false;
                }
            }
        }

        history.push({ id: piece.id, x: piece.x, y: piece.y });
        piece.x = nextX;
        piece.y = nextY;
        moves += 1;
        startTimer();
        render();
        checkWin();
        return true;
    }

    function boardCellFromPointer(event) {
        const rect = board.getBoundingClientRect();
        const gap = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap")) || 0;
        const unit = rect.width / COLS;
        const cell = unit - gap;
        const x = Math.floor((event.clientX - rect.left) / unit);
        const y = Math.floor((event.clientY - rect.top) / unit);

        if (x < 0 || y < 0 || x >= COLS || y >= ROWS) {
            return null;
        }

        for (const piece of pieces) {
            if (
                x >= piece.x &&
                x < piece.x + piece.w &&
                y >= piece.y &&
                y < piece.y + piece.h
            ) {
                return { x, y, piece };
            }
        }
        return { x, y, piece: null, unit, cell };
    }

    function onBoardClick(event) {
        if (!selectedId || finished) {
            return;
        }

        const cell = boardCellFromPointer(event);
        if (!cell || cell.piece) {
            return;
        }

        const selected = findPiece(selectedId);
        const adjacent = isAdjacentToPiece(cell.x, cell.y, selected);
        if (!adjacent) {
            return;
        }

        movePiece(selected, adjacent.dx, adjacent.dy);
    }

    function isAdjacentToPiece(x, y, piece) {
        const candidates = [];
        for (let py = piece.y; py < piece.y + piece.h; py += 1) {
            for (let px = piece.x; px < piece.x + piece.w; px += 1) {
                candidates.push({ px, py });
            }
        }

        for (const point of candidates) {
            if (Math.abs(point.px - x) + Math.abs(point.py - y) === 1) {
                return {
                    dx: Math.sign(x - point.px),
                    dy: Math.sign(y - point.py)
                };
            }
        }
        return null;
    }

    function startTimer() {
        if (started || finished) {
            return;
        }
        started = true;
        timerId = window.setInterval(() => {
            seconds += 1;
            timer.textContent = formatTime(seconds);
        }, 1000);
    }

    function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const remainder = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
    }

    function checkWin() {
        const caoCao = findPiece("cao");
        if (caoCao.x === 1 && caoCao.y === 3) {
            finished = true;
            selectedId = null;
            window.clearInterval(timerId);
            timerId = null;
            winSummary.textContent = `${moves} 步 · ${formatTime(seconds)}`;
            overlay.classList.add("is-visible");
            render();
        }
    }

    function undo() {
        if (finished || history.length === 0) {
            return;
        }
        const previous = history.pop();
        const piece = findPiece(previous.id);
        piece.x = previous.x;
        piece.y = previous.y;
        moves = Math.max(0, moves - 1);
        selectedId = piece.id;
        render();
    }

    function resetGame() {
        pieces = cloneLayout();
        selectedId = null;
        moves = 0;
        seconds = 0;
        started = false;
        finished = false;
        history = [];
        window.clearInterval(timerId);
        timerId = null;
        timer.textContent = "00:00";
        overlay.classList.remove("is-visible");
        render();
    }

    document.addEventListener("keydown", (event) => {
        if (!selectedId || finished) {
            return;
        }
        const piece = findPiece(selectedId);
        const directions = {
            ArrowLeft: [-1, 0],
            ArrowRight: [1, 0],
            ArrowUp: [0, -1],
            ArrowDown: [0, 1]
        };
        const direction = directions[event.key];
        if (!direction) {
            return;
        }
        event.preventDefault();
        movePiece(piece, direction[0], direction[1]);
    });

    board.addEventListener("click", onBoardClick);
    document.getElementById("undo").addEventListener("click", undo);
    document.getElementById("reset").addEventListener("click", resetGame);
    document.getElementById("playAgain").addEventListener("click", resetGame);

    render();
</script>
</body>
</html>
