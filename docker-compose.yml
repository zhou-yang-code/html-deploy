services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: html_deploy
      POSTGRES_USER: html_deploy
      POSTGRES_PASSWORD: html_deploy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U html_deploy -d html_deploy"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/html-deploy
        mc anonymous set none local/html-deploy

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/html_deploy
      DB_USERNAME: html_deploy
      DB_PASSWORD: html_deploy
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: html-deploy
      STORAGE_ROOT: /srv/html-deploy
      NGINX_ROOT: /srv/html-deploy/www
      PUBLIC_BASE_URL: http://localhost:8080
      CONTENT_SCHEME: http
      CONTENT_DOMAIN: apps.localhost:8081
      JWT_SECRET: local-compose-jwt-secret-change-before-production
      UPLOAD_TOKEN_SECRET: local-compose-upload-secret-change-before-production
    ports:
      - "8080:8080"
    volumes:
      - deploy-data:/srv/html-deploy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  console:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

  content:
    build:
      context: ./deploy/nginx
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - deploy-data:/srv/html-deploy:ro

volumes:
  postgres-data:
  minio-data:
  deploy-data:
